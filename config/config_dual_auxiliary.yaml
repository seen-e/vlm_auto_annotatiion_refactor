#在scene前对辅助视角进行vlm标注，基于其标注信息对后续进行分析。理论上是四个stage，但是夹爪，支架数量不一致，所以会比较长

# Lightweight configurable VLM experiment pipeline.
# 轻量级多阶段 VLM 实验框架配置。
#
# 设计原则：
# 1. workflow 控制 stage 执行顺序。
# 2. stages.<stage_name> 控制单个 stage 的 prompt、视频处理参数和生成参数。
# 3. prompt 中可以直接用占位符引用上游输出：
#      {{ ctx.stages.scene.output }}
#      {{ ctx.stages.scene.output.executors }}
#      {{ ctx.stages.analysis.output.action_sequence.0.action }}
# 4. prompt 中也可以引用 prompts/*.py 中的公共片段：
#      {{ prompt.common.JSON_ONLY_RULE }}
#      {{ prompt.common.ACTION_VOCABULARY }}
# 5. 新增 stage 时，通常只需要：
#      a) 新增 prompts/<stage_name>.py
#      b) 在 stages 下新增同名配置
#      c) 在 workflow 中插入该 stage 名称

# workflow: stage 执行顺序。
# 可填写内容：stage 名称列表，每个名称必须存在于下面的 stages 字段。
# 示例：
#   workflow:
#     - scene
#     - object_state
#     - analysis
#     - refinement
workflow:
  - auxiliary_view_left
  - auxiliary_view_right

# model: 默认模型调用参数。

# model: 默认模型调用参数。
# stage 中可以通过 generation 字段覆盖 max_tokens、temperature、top_p、top_k、max_retries 等参数。
model:
  # base_url: OpenAI-compatible API 地址。
  # 本地 vLLM 示例：http://127.0.0.1:8002/v1
  base_url: "http://1993781598432617.cn-wulanchabu.pai-eas.aliyuncs.com/api/predict/quickstart_deploy_20260717_xtvt/v1"
  #"http://127.0.0.1:8002/v1"
  #qwen122B "http://1993781598432617.cn-wulanchabu.pai-eas.aliyuncs.com/api/predict/quickstart_deploy_20260713_olyp/v1"
  #qwen397B "http://1993781598432617.cn-wulanchabu.pai-eas.aliyuncs.com/api/predict/quickstart_deploy_20260717_xtvt/v1"

  # api_key: API key。
  # 本地 vLLM 通常可以使用 "EMPTY"。
  api_key: "YmNjODIyN2EyNTViY2ZmNmNhYzBhNDZkNzUyNTQ1NzJhMTQ5NGUxMw=="
  #"EMPTY"
  #qwen122B"OTk4NzQ4MTk1ZjQzMTQ5OTRjODIyNWQzMGQyODM5ZGVkNWEyMGQxNQ=="
  #qwen397B"Yjk0MzNhYjUyNTU3M2I3MjdkMTI0MzVkMWJhNTE2MDc3NmQ2MTM2MQ=="

  # model: 模型名称，需要与 /v1/models 返回的 id 一致。
  # 例如："Qwen3-VL-8B-Instruct"、"Qwen3-VL-30B-A3B-Instruct-FP8"。
  model: "Qwen3.5-397B-A17B-FP8"
  #"Qwen3.5-27B"
  #"Qwen3.5-122B-A10B"
  #"Qwen3.5-397B-A17B-FP8"

  # max_tokens: 默认最大输出 token 数。
  # 如果 stage 输出较长，可在对应 stage.generation 中覆盖。
  max_tokens: 4096

  # temperature: 采样温度。
  # 标注任务建议 0.0，保证输出稳定。
  temperature: 0.0

  # top_p: nucleus sampling 参数；如果不需要可设为 null 或删除。
  top_p: 0.95

  # top_k: 部分 OpenAI-compatible 服务支持的额外采样参数。
  # 0 表示不显式传入 top_k；大于 0 时会通过 extra_body 传给服务端。
  top_k: 0

  # extra_body: 透传给 OpenAI-compatible 服务端的额外请求体。
  # Qwen thinking 模型如需避免长时间只生成 reasoning，可在 vLLM 支持时关闭 thinking。
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

  # max_retries: 模型请求失败时的最大重试次数。
  max_retries: 3


stages:

  auxiliary_view_left:
    prompt:
      module: "prompts_4stage.gripper_prompt"
      system: "WRIST_SYSTEM_PROMPT"
      user: "WRIST_USER_PROMPT"
    output_key: "wrist_view_left"

    generation:
       max_tokens: 32768
       
    video:
      input_mode: "image_sequence"
      # 是否在每个 image_url 前加入 <t=...s> <view_name> 文字标签。
      add_frame_tags: true
      # max_time: 当前 stage 的最大原始视频处理时长，单位秒。
      # -1 表示不限制；大于 0 表示只处理 [0, max_time)。
      # 该参数与 fps、max_frames、frame_start/frame_end 取交集后再抽帧。
      max_time: -1
      save_processed: true
      # refinement 需要更精细的边界定位，通常使用更高 fps。
      fps: 8.0
      max_frames: 512
      resize_width: 672
      # refinement 看边界和接触事件，建议保留较高 JPEG 质量。
      jpeg_quality: 95
      draw_timestamps: true
      draw_view_names: true
      draw_montage_axes: true
      min_api_frames: 2
      merge_views: false
      merge_mode: "per_frame"
      merge_length: -1
      view_names:
        - camera_wrist_left

  auxiliary_view_right:
    prompt:
      module: "prompts_4stage.gripper_prompt"
      system: "WRIST_SYSTEM_PROMPT"
      user: "WRIST_USER_PROMPT"
    output_key: "wrist_view_right"

    generation:
       max_tokens: 32768
       
    video:
      input_mode: "image_sequence"
      # 是否在每个 image_url 前加入 <t=...s> <view_name> 文字标签。
      add_frame_tags: true
      # max_time: 当前 stage 的最大原始视频处理时长，单位秒。
      # -1 表示不限制；大于 0 表示只处理 [0, max_time)。
      # 该参数与 fps、max_frames、frame_start/frame_end 取交集后再抽帧。
      max_time: -1
      save_processed: true
      # refinement 需要更精细的边界定位，通常使用更高 fps。
      fps: 8.0
      max_frames: 512
      resize_width: 672
      # refinement 看边界和接触事件，建议保留较高 JPEG 质量。
      jpeg_quality: 95
      draw_timestamps: true
      draw_view_names: true
      draw_montage_axes: true
      min_api_frames: 2
      merge_views: false
      merge_mode: "per_frame"
      merge_length: -1
      view_names:
        - camera_wrist_right
