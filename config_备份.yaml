  #     module: "prompts.object_state"
  #     system: "SYSTEM_PROMPT"
  #     user: "USER_PROMPT_TEMPLATE"
  #   output_key: "object_state"
  #   video:
  #     input_mode: "image_sequence"
  #     max_time: -1
  #     save_processed: false
  #     processed_output_path: "outputs/processed_frames"
  #     fps: 1.0
