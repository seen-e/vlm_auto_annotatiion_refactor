  #     resize_width: 336
  #     jpeg_quality: 85
  #     draw_timestamps: true
  #     draw_view_names: true
  #     min_api_frames: 2
  #     merge_views: true
  #     merge_mode: "per_frame"
  #     merge_length: 8
